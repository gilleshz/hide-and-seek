name: Build and sign Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  OUTPUT_DIR: android/app/build/outputs/apk/release

# A new push to the same tag cancels the in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - run: ./gradlew detekt --continue
      - run: ./gradlew testDebugUnitTest

  build:
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Parse version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION_NAME="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          # Fail on a missing secret instead of producing an unsigned APK.
          test -s app/release.jks || { echo 'KEYSTORE_BASE64 secret is missing or empty' >&2; exit 1; }

      - name: Assemble release APK
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Rename APK to versioned filename
        id: apk
        env:
          TAG: ${{ github.ref_name }}
        run: |
          APK_NAME="hideandseek_${TAG}.apk"
          mv "app/build/outputs/apk/release/app-release.apk" \
             "app/build/outputs/apk/release/${APK_NAME}"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hideandseek-${{ steps.version.outputs.versionName }}
          path: ${{ env.OUTPUT_DIR }}/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ${{ env.OUTPUT_DIR }}/${{ steps.apk.outputs.name }}
          generate_release_notes: true
