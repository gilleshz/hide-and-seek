# JVM args for the Gradle daemon. Bump -Xmx if you hit OutOfMemory during builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run independent tasks/modules in parallel and cache task outputs, faster builds.
org.gradle.parallel=true
org.gradle.caching=true
# Skip the configuration phase on repeated invocations (same inputs, same build scripts).
org.gradle.configuration-cache=true

# AndroidX is the modern support-library namespace (required by all current libraries).
android.useAndroidX=true

# Kotlin code style used by the Kotlin Gradle plugin's formatting.
kotlin.code.style=official

# Only generate the resource classes (R) that each module actually needs.
android.nonTransitiveRClass=true
