name: jetlag

services:
  app:
    # Pin a version instead of :latest for production.
    image: ghcr.io/gilleshz/hide-and-seek:latest
    restart: unless-stopped
    environment:
      OVERPASS_MIRRORS: https://overpass.osm.ch/api/interpreter,https://overpass-api.de/api/interpreter
      STADIA_API_KEY: ""
      THUNDERFOREST_API_KEY: ""
      MAPTILER_API_KEY: ""
      PRIM_API_KEY: ""
      CTS_API_TOKEN: ""
      SYTRAL_SIRI_USER: ""
      SYTRAL_SIRI_PASSWORD: ""
      PUBLIC_URL: https://play.example.com
      APP_API_KEY: ""
      MAX_BOUNDARY_SPAN_DEG: 5.0
      DATABASE_URL: postgresql://CHANGE_ME:CHANGE_ME@db:5432/jetlag?serverVersion=16&charset=utf8
      FRANKENPHP_WORKER_MODE: 1
      FRANKENPHP_WORKER_COUNT: 4
      FRANKENPHP_WORKER_THREADS: 2
      FRANKENPHP_LOOP_MAX: 500
    ports:
      - 8080:80
    volumes:
      - /srv/jetlag/uploads:/app/var/uploads
      - /srv/jetlag/tiles:/app/var/tiles
      - secrets:/app/config/secrets
      - catalog:/app/var/transit-catalog
      - logs:/app/var/log
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/healthz\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    # Resource caps, adjust to your hardware; the transit pipeline is CPU/memory-heavy.
    mem_limit: 4g
    cpus: "4.0"
    stop_grace_period: 30s

  db:
    image: postgis/postgis:16-3.6
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: jetlag
      POSTGRES_USER: CHANGE_ME
      POSTGRES_PASSWORD: CHANGE_ME
    volumes:
      - /srv/jetlag/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U CHANGE_ME"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  secrets:
  logs:
  catalog:
